name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      # Runs here, on a PR, and not only in the Pages deploy on main. The guard
      # is the thing most likely to disagree between a laptop and a runner, so
      # it has to be exercised where it can still be fixed cheaply.
      - name: Verify the exported model is current
        run: python -m stroke.export_web --check

      # The smoke run uses --fast (one CV repeat, 200 bootstrap resamples) so CI
      # stays inside the free tier. The figures published in the README come from
      # a full local run, not from this job.
      - name: Smoke train
        run: python -m stroke.train --fast

      - name: Check the reported metrics are well-formed
        run: |
          python - <<'PY'
          import json, pathlib, sys

          m = json.loads(pathlib.Path("outputs/metrics.json").read_text())
          test = m["selected"]["test"]

          # The held-out split must still look like the population, not balanced.
          assert test["prevalence"] < 0.10, test["prevalence"]

          # A degenerate model must score at its no-skill floor.
          majority = m["per_config_test"]["baseline_majority"]
          assert abs(majority["roc_auc"] - 0.5) < 1e-9, majority["roc_auc"]
          assert abs(majority["pr_auc"] - majority["prevalence"]) < 0.01

          # And the real model must clear that floor.
          assert test["pr_auc"] > 2 * test["pr_auc_no_skill"], test["pr_auc"]

          lo, hi = test["pr_auc_ci95"]
          assert lo < test["pr_auc"] < hi, (lo, test["pr_auc"], hi)

          assert m["selected"]["test"]["operating_point"]["threshold_source"] == (
              "training out-of-fold"
          )
          print("metrics.json OK")
          PY
