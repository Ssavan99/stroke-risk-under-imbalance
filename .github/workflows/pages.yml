name: Deploy demo to Pages

# Publishes web/ to GitHub Pages. Runs only on the default branch, so the demo
# goes live when the revival PR is merged and not before.
#
# GitHub Pages must be enabled once by hand, with Settings > Pages > Source set
# to "GitHub Actions". Free tier; no secrets needed.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The published page must match the committed model, so the export is
      # regenerated and compared rather than trusted.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # A numeric comparison, not a byte comparison: fitted coefficients differ
      # in the last units in the last place between BLAS builds, so diffing the
      # regenerated JSON fails on runner-vs-laptop noise rather than real drift.
      - name: Verify the exported model is current
        run: |
          python -m stroke.export_web --check || {
            echo "::error::web/ is stale — run 'python -m stroke.export_web' and commit the result"
            exit 1
          }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
